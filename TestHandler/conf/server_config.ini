# ---- log ----
log_dir = ./log
# 0 emerg 1 alert 2 crit 3 error 4 warn 5 notice 6 info 7 debug 8 trace
log_level = 6
log_size = 104857600
log_maxfiles = 10
# 1 terminal, 2 file, 3 both
log_dest = 3
#log_prefix = andy_

# ---- process ----
# foreground | background
run_mode = foreground
#pid_file = ./mulserver.pid
worker_num = 4
bind_file = ./conf/server_bind.txt
dll_file = ./libtesthandler.so

# ---- queues & buffers ----
ringqueue_length = 8388608
send_queue_length = 16777216
max_packet_size = 65536
recv_buffer = 65536
send_buffer_max = 67108864
send_high_watermark = 1048576
# close | drop
send_overflow_policy = close

# ---- network ----
listen_backlog = 1024
connect_timeout_ms = 10000
tcp_nodelay = 1
max_connections = 100000
# epoll | poll
#event_engine = epoll
timer_interval_ms = 100

# ---- test plugin ----
# echo | relay
test_mode = echo
relay_target_ip = 127.0.0.1
relay_target_port = 12345
